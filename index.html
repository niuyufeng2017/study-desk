<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三升四暑假学习工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --green:#7CB342;--green-d:#558B2F;--green-l:#DCEDC8;
  --pink:#F06292;--pink-l:#FCE4EC;
  --blue:#64B5F6;--blue-l:#E3F2FD;
  --yellow:#FFB74D;--yellow-l:#FFF8E1;
  --purple:#BA68C8;--purple-l:#F3E5F5;
  --orange:#FF8A65;--orange-l:#FBE9E7;
  --red:#E57373;--red-l:#FFEBEE;
  --gray:#BDBDBD;--gray-l:#F5F5F5;
  --bg:#FAFAF7;--card:#fff;--text:#4A4A4A;--text-l:#9E9E9E;
  --shadow:0 2px 8px rgba(0,0,0,.06);--shadow-h:0 4px 16px rgba(0,0,0,.1);
  --radius:14px;--radius-s:10px;
  --sidebar-w:180px;
}
html,body{height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px}
ul{list-style:none}

/* === Layout === */
.app{display:flex;height:100vh}
.sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid #EEE;display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto;flex-shrink:0;z-index:10}
.main{flex:1;overflow-y:auto;padding:20px 28px}
.page{display:none;animation:fade .3s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* === Sidebar === */
.profile{display:flex;align-items:center;gap:10px;padding:10px 8px;margin-bottom:14px;border-radius:var(--radius);background:linear-gradient(135deg,var(--green-l),var(--yellow-l))}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.profile .name{font-weight:600;font-size:14px;line-height:1.3}
.profile .grade{font-size:11px;color:var(--text-l)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-s);color:var(--text);font-size:14px;transition:.2s;position:relative}
.nav-item:hover{background:var(--gray-l)}
.nav-item.active{background:var(--green-l);color:var(--green-d);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:18px;background:var(--green);border-radius:0 4px 4px 0}
.nav-item .ico{font-size:18px;width:22px;text-align:center}
.nav-item .badge{margin-left:auto;font-size:11px;background:var(--orange);color:#fff;padding:1px 7px;border-radius:10px;font-weight:600}

/* === Cards === */
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:.2s}
.card:hover{box-shadow:var(--shadow-h)}
.section-title{font-size:17px;font-weight:700;margin:18px 0 12px;display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:0}
.section-title .more{margin-left:auto;font-size:12px;color:var(--text-l);font-weight:400}

/* === Stat Cards === */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat-card{background:#fff;border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-card .lbl{font-size:12px;color:var(--text-l);margin-bottom:6px}
.stat-card .val{font-size:24px;font-weight:700;line-height:1}
.stat-card .sub{font-size:11px;color:var(--text-l);margin-top:4px}
.stat-card .ico{position:absolute;right:10px;top:10px;font-size:28px;opacity:.2}

/* === Subject Cards === */
.subj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.subj-card{border-radius:var(--radius);padding:18px;color:#fff;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.subj-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.subj-card.yu{background:linear-gradient(135deg,#F06292,#EC407A)}
.subj-card.shu{background:linear-gradient(135deg,#64B5F6,#42A5F5)}
.subj-card.ying{background:linear-gradient(135deg,#FFB74D,#FFA726)}
.subj-card .ico{font-size:32px;margin-bottom:8px}
.subj-card .name{font-size:18px;font-weight:700;margin-bottom:4px}
.subj-card .meta{font-size:12px;opacity:.9;margin-bottom:10px}
.subj-card .progress{height:6px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
.subj-card .progress-bar{height:100%;background:#fff;border-radius:3px;transition:.4s}
.subj-card .enter{font-size:12px;margin-top:8px;opacity:.9}

/* === Task List === */
.task-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-s);background:#fff;margin-bottom:8px;box-shadow:var(--shadow);transition:.2s}
.task-item.done{opacity:.55}
.task-item.done .task-title{text-decoration:line-through}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--gray);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s;font-size:13px;color:#fff}
.task-item.done .task-check{background:var(--green);border-color:var(--green)}
.task-body{flex:1;min-width:0}
.task-title{font-size:14px;font-weight:500}
.task-meta{font-size:11px;color:var(--text-l);margin-top:3px;display:flex;gap:8px;align-items:center}
.task-meta .tag{padding:1px 7px;border-radius:8px;font-size:10px}
.tag-yu{background:var(--pink-l);color:var(--pink)}
.tag-shu{background:var(--blue-l);color:#1976D2}
.tag-ying{background:var(--yellow-l);color:#E65100}
.tag-fit{background:var(--green-l);color:var(--green-d)}
.sun-reward{font-size:12px;color:var(--orange);font-weight:600;flex-shrink:0}

/* === Mistake === */
.weak-bars{margin-bottom:8px}
.weak-bar{margin-bottom:10px}
.weak-bar .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.weak-bar .track{height:10px;background:var(--gray-l);border-radius:5px;overflow:hidden}
.weak-bar .fill{height:100%;border-radius:5px;transition:.4s}
.filter-tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.filter-tag{padding:4px 12px;border-radius:14px;font-size:12px;background:var(--gray-l);cursor:pointer;transition:.2s}
.filter-tag.active{background:var(--green);color:#fff}
.mistake-item{background:#fff;border-radius:var(--radius-s);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border-left:3px solid var(--red)}
.mistake-item.mastered{opacity:.5;border-left-color:var(--green)}
.mistake-item .top{display:flex;justify-content:space-between;align-items:start;margin-bottom:6px}
.mistake-item .q{font-size:14px;font-weight:500;flex:1}
.mistake-item .type{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--red-l);color:var(--red);margin-left:8px;white-space:nowrap}
.mistake-item .meta{font-size:11px;color:var(--text-l);display:flex;gap:10px}
.btn-mini{font-size:12px;padding:3px 10px;border-radius:8px;background:var(--green-l);color:var(--green-d);font-weight:600}
.btn-mini.danger{background:var(--red-l);color:var(--red)}

/* === PvZ === */
.pvz-top{display:flex;gap:12px;margin-bottom:16px}
.pvz-stat{flex:1;background:linear-gradient(135deg,var(--yellow-l),#fff);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow)}
.pvz-stat .ico{font-size:28px}
.pvz-stat .val{font-size:22px;font-weight:700;color:var(--orange)}
.pvz-stat .lbl{font-size:11px;color:var(--text-l)}
.pvz-board-wrap{display:flex;gap:14px;margin-bottom:16px}
.pvz-board{flex:1;background:linear-gradient(135deg,#81C784,#66BB6A);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)}
.pvz-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.pvz-cell{aspect-ratio:1;background:rgba(255,255,255,.25);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;transition:.2s;border:2px dashed transparent}
.pvz-cell:hover{border-color:rgba(255,255,255,.6)}
.pvz-cell.planted{background:rgba(255,255,255,.4)}
.pvz-zombies{width:140px;background:linear-gradient(135deg,#616161,#424242);border-radius:var(--radius);padding:10px;color:#fff}
.pvz-zombies .ttl{font-size:12px;margin-bottom:8px;opacity:.9;text-align:center}
.zombie-item{background:rgba(255,255,255,.1);border-radius:8px;padding:8px;margin-bottom:6px;text-align:center}
.zombie-item .ico{font-size:22px}
.zombie-item .cnt{font-size:11px;opacity:.8}
.pvz-energy{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.energy-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #EEE;font-size:13px}
.energy-item:last-child{border:none}
.energy-item .ico{font-size:18px}
.energy-item .name{flex:1}
.energy-item .sun{color:var(--orange);font-weight:600}
.energy-item.done .name{text-decoration:line-through;opacity:.5}
.pvz-actions{display:flex;gap:8px;margin-top:14px}
.pvz-actions button{flex:1;padding:10px;border-radius:var(--radius-s);font-size:13px;font-weight:600}
.btn-shop{background:var(--green-l);color:var(--green-d)}
.btn-reset{background:var(--gray-l);color:var(--text)}

/* Shop Modal items */
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shop-item{background:var(--green-l);border-radius:var(--radius-s);padding:14px;text-align:center;cursor:pointer;transition:.2s}
.shop-item:hover{transform:translateY(-2px)}
.shop-item .ico{font-size:30px}
.shop-item .name{font-size:12px;margin:4px 0}
.shop-item .price{font-size:13px;color:var(--orange);font-weight:700}

/* === Reward === */
.reward-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.reward-card{background:#fff;border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow);position:relative}
.reward-card .ico{font-size:36px}
.reward-card .name{font-size:14px;font-weight:600;margin:6px 0}
.reward-card .cost{font-size:13px;color:var(--orange);font-weight:700;margin-bottom:8px}
.reward-card .btn{padding:6px 16px;border-radius:14px;background:var(--green);color:#fff;font-size:12px;font-weight:600}
.reward-card .btn:disabled{background:var(--gray);cursor:not-allowed}

/* === Calendar === */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal-head{text-align:center;font-size:12px;color:var(--text-l);padding:6px 0;font-weight:600}
.cal-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:.2s;background:#fff;box-shadow:var(--shadow)}
.cal-cell:hover{transform:scale(1.08)}
.cal-cell.full{background:var(--green);color:#fff}
.cal-cell.partial{background:var(--yellow);color:#fff}
.cal-cell.none{background:var(--red);color:#fff}
.cal-cell.empty{background:var(--gray-l);color:var(--text-l)}
.cal-cell.today{outline:2px solid var(--green-d);outline-offset:1px}
.legend{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px}
.legend-dot{width:14px;height:14px;border-radius:4px}

/* === English === */
.eng-card{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:10px;box-shadow:var(--shadow);border-left:4px solid var(--blue)}
.eng-card .en{font-size:17px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.eng-card .speak{cursor:pointer;font-size:16px}
.eng-card .zh{font-size:13px;color:var(--text-l);margin-bottom:8px}
.eng-card .scene{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;background:var(--blue-l);color:#1976D2}

/* === Plan === */
.plan-item{background:#fff;border-radius:var(--radius-s);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.plan-item.done{opacity:.55}
.plan-item.done .t{text-decoration:line-through}
.plan-prio{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.prio-high{background:var(--red)}
.prio-mid{background:var(--yellow)}
.prio-low{background:var(--green)}
.plan-item .t{flex:1;font-size:14px;font-weight:500}
.plan-item .meta{font-size:11px;color:var(--text-l)}

/* === Inspiration === */
.insp-item{background:#fff;border-radius:var(--radius-s);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border-left:3px solid var(--purple)}
.insp-item .t{font-size:14px;font-weight:600;margin-bottom:4px}
.insp-item .c{font-size:13px;color:var(--text-l);margin-bottom:6px;white-space:pre-wrap}
.insp-item .tags{display:flex;gap:6px;flex-wrap:wrap}
.insp-item .tag{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--purple-l);color:var(--purple)}

/* === Fitness === */
.fit-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fit-section{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.fit-section h4{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.water-cups{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.water-cup{font-size:24px;cursor:pointer;filter:grayscale(1);opacity:.4;transition:.2s}
.water-cup.filled{filter:none;opacity:1}

/* === Settings === */
.set-group{background:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.set-group h4{font-size:14px;margin-bottom:12px;color:var(--green-d)}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0F0F0;font-size:14px}
.set-row:last-child{border:none}
.set-row input[type=text],.set-row input[type=number],.set-row select{padding:6px 10px;border:1px solid #E0E0E0;border-radius:8px;width:120px;text-align:right}
.set-row input[type=range]{width:140px}
.switch{width:42px;height:24px;background:var(--gray);border-radius:12px;position:relative;transition:.2s;cursor:pointer}
.switch.on{background:var(--green)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{left:20px}

/* === Buttons === */
.btn{padding:8px 18px;border-radius:var(--radius-s);background:var(--green);color:#fff;font-size:13px;font-weight:600;transition:.2s}
.btn:hover{background:var(--green-d)}
.btn-out{background:#fff;color:var(--green-d);border:1px solid var(--green)}
.btn-fab{position:fixed;right:28px;bottom:28px;width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;font-size:26px;box-shadow:var(--shadow-h);display:flex;align-items:center;justify-content:center;z-index:20}

/* === Modal === */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);padding:20px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto}
.modal h3{font-size:17px;margin-bottom:14px}
.modal .field{margin-bottom:12px}
.modal .field label{display:block;font-size:13px;margin-bottom:4px;color:var(--text-l)}
.modal .field input,.modal .field textarea,.modal .field select{width:100%;padding:8px 12px;border:1px solid #E0E0E0;border-radius:8px}
.modal .field textarea{resize:vertical;min-height:70px}
.modal .actions{display:flex;gap:10px;margin-top:16px}
.modal .actions button{flex:1;padding:10px;border-radius:var(--radius-s);font-size:14px;font-weight:600}
.btn-cancel{background:var(--gray-l);color:var(--text)}

/* === Toast === */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#333;color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;z-index:200;transition:.3s;box-shadow:var(--shadow-h)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.sun{background:var(--orange)}

/* === Subject detail back === */
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--green-d);margin-bottom:12px;cursor:pointer;font-weight:600}

/* === Scrollbar === */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#DDD;border-radius:3px}

/* === Responsive === */
@media(max-width:768px){
  :root{--sidebar-w:64px}
  .sidebar{padding:12px 6px}
  .profile{flex-direction:column;padding:8px;gap:4px}
  .profile .name,.profile .grade{display:none}
  .nav-item{flex-direction:column;gap:4px;padding:8px 4px;font-size:10px}
  .nav-item .ico{font-size:20px}
  .nav-item .badge{position:absolute;top:2px;right:8px;font-size:9px;padding:0 5px}
  .main{padding:14px}
  .subj-grid{grid-template-columns:1fr}
  .fit-grid{grid-template-columns:1fr}
  .pvz-board-wrap{flex-direction:column}
  .pvz-zombies{width:auto;display:flex;gap:8px;overflow-x:auto}
  .pvz-zombies .ttl{display:none}
  .zombie-item{min-width:80px}
  .shop-grid{grid-template-columns:repeat(2,1fr)}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile">
      <div class="avatar">👦</div>
      <div>
        <div class="name" id="sbName">牛羽枫</div>
        <div class="grade" id="sbGrade">三升四</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <!-- Main -->
  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast"></div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>

<script>
/* ========================================================
   三升四暑假学习工作台
   单页应用 + localStorage 数据互通
======================================================== */

const STORE_PREFIX = 'plsz4_v5_';
const todayStr = () => new Date().toISOString().slice(0,10);
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- 默认数据 ---------- */
const DEFAULT_DATA = {
  user: { nickname:'牛羽枫', grade:'三升四', avatar:'👦' },
  settings: {
    baseSun: 10,
    streakBonus: 20,
    soundOn: true,
    voice: 'female',
    zombiePerMiss: 1,
  },
  tasks: [
    { id:uid(), title:'预习新课一篇并抄写生字', subject:'yu', date:todayStr(), done:false, weight:1, mins:30 },
    { id:uid(), title:'完成阅读理解2篇', subject:'yu', date:todayStr(), done:false, weight:1, mins:25 },
    { id:uid(), title:'阅读摘抄一篇', subject:'yu', date:todayStr(), done:false, weight:1, mins:20 },
    { id:uid(), title:'课外阅读一小时', subject:'yu', date:todayStr(), done:false, weight:1, mins:60 },
    { id:uid(), title:'口算100题', subject:'shu', date:todayStr(), done:false, weight:1, mins:20, mode:'oral' },
    { id:uid(), title:'数学应用题5道', subject:'shu', date:todayStr(), done:false, weight:1, mins:25, mode:'word' },
    { id:uid(), title:'英语单词打卡20个', subject:'ying', date:todayStr(), done:false, weight:1, mins:15 },
    { id:uid(), title:'英语听力练习15分钟', subject:'ying', date:todayStr(), done:false, weight:1, mins:15 },
    { id:uid(), title:'跳绳200个', subject:'fit', date:todayStr(), done:false, weight:1, mins:15 },
    { id:uid(), title:'饮水8杯', subject:'fit', date:todayStr(), done:false, weight:1, mins:5 },
  ],
  mistakes: [
    { id:uid(), subject:'yu', type:'拼音声调遗漏', q:'"美丽"的"丽"字拼音写成了 lì（正确为 lí）', a:'lí，第二声', mastered:false, ts:Date.now()-86400000*2 },
    { id:uid(), subject:'shu', type:'计算失误', q:'36 × 4 = 124', a:'36 × 4 = 144', mastered:false, ts:Date.now()-86400000 },
    { id:uid(), subject:'shu', type:'审题不清', q:'"比35多17的数"算成了35+7=42', a:'35+17=52', mastered:false, ts:Date.now()-3600000*5 },

const DB = {
  load(){
    const out = {};
    for(const k in DEFAULT_DATA){
      const raw = localStorage.getItem(STORE_PREFIX+k);
      let val;
      try { val = raw ? JSON.parse(raw) : null; } catch(e){ val = null; }
      if(val && typeof val === 'object'){
        // 合并缺省字段，防止脏数据缺字段
        val = Array.isArray(DEFAULT_DATA[k]) ? (Array.isArray(val)? val : DEFAULT_DATA[k]) : {...DEFAULT_DATA[k], ...val};
      }else{
        val = JSON.parse(JSON.stringify(DEFAULT_DATA[k]));
      }
      out[k] = val;
    }
    return out;
  },
  save(key, val){
    localStorage.setItem(STORE_PREFIX+key, JSON.stringify(val));
  },
  saveAll(data){
    for(const k in data) this.save(k, data[k]);
  }
};

/* ---------- 计算派生数据 ---------- */
function todayTasks(){ return data.tasks.filter(t=>t.date===todayStr()); }
function subjTasks(subj){ return todayTasks().filter(t=>t.subject===subj); }
function taskProgress(){
  const ts = todayTasks().filter(t=>t.subject!=='fit');
  const done = ts.filter(t=>t.done).length;
  return { total:ts.length, done, rate: ts.length? Math.round(done/ts.length*100):0 };
}
function checkinStatus(date){
  const ts = data.tasks.filter(t=>t.date===date && t.subject!=='fit');
  if(ts.length===0) return 'empty';
  const done = ts.filter(t=>t.done).length;
  if(done===ts.length) return 'full';
  if(done===0) return 'none';
  return 'partial';
}
function recomputeStreak(){
  // 连续打卡：从今天往前数，全勤或部分完成都算
  let s = 0;
  let d = new Date();
  while(true){
    const ds = d.toISOString().slice(0,10);
    const st = checkinStatus(ds);
    if(st==='full'||st==='partial'){ s++; d.setDate(d.getDate()-1); }
    else break;
  }
  data.streak = s;
}

/* ---------- 阳光操作 ---------- */
function addSun(n, reason){
  data.sun += n;
  save();
  toast((n>0?'+':'')+n+' ☀️ '+reason, n>0);
  renderSidebar();
}
function spendSun(n){
  if(data.sun < n) return false;
  data.sun -= n;
  save();
  renderSidebar();
  return true;
}

/* ---------- 任务完成联动 ---------- */
function toggleTask(id){
  const t = data.tasks.find(x=>x.id===id);
  if(!t) return;
  t.done = !t.done;
  if(t.done){
    const bonus = data.settings.streakBonus/100;
    const gain = Math.round(data.settings.baseSun * t.weight * (1+bonus));
    data.sun += gain;
    toast('+ '+gain+' ☀️ 完成任务！', true);
  }else{
    data.sun -= Math.round(data.settings.baseSun * t.weight);
  }
  // 更新打卡日历
  data.checkin[todayStr()] = checkinStatus(todayStr());
  recomputeStreak();
  save();
  renderCurrent();
}

/* ---------- 数学练习：题目生成 ---------- */
function seededRand(seed){
  let s = 0; for(let i=0;i<seed.length;i++) s = (s*31 + seed.charCodeAt(i)) >>> 0;
  return ()=>{ s = (s*1103515245 + 12345) & 0x7fffffff; return s/0x7fffffff; };
}
function round1(n){ return Math.round(n*100)/100; }
function getDailyMath(mode){
  const ds = todayStr();
  if(!data.dailyMath[ds]) data.dailyMath[ds] = {};
  if(!data.dailyMath[ds][mode]){
    data.dailyMath[ds][mode] = mode==='oral' ? genOral(ds) : genWord(ds);
    save();
  }
  return data.dailyMath[ds][mode];
}
function genOral(ds){
  const rnd = seededRand('oral-'+ds);
  const out = [];
  for(let i=0;i<100;i++){
    const op = rnd()<0.5 ? '+' : '-';
    let a, b, ans;
    if(rnd()<0.5){
      // 一位小数
      a = round1(Math.floor(rnd()*90+10) + rnd());
      b = round1(Math.floor(rnd()*a) + rnd());
    }else{
      // 两位小数
      a = Math.floor(rnd()*90+10) + Math.round(rnd()*100)/100;
      b = Math.floor(rnd()*a) + Math.round(rnd()*100)/100;
      a = round1(a); b = round1(b);
    }
    if(op==='-'){ if(a<b){ [a,b]=[b,a]; } ans = round1(a-b); }
    else ans = round1(a+b);
    out.push({ q:`${a} ${op} ${b}`, a:ans });
  }
  return out;
}
function genWord(ds){
  const rnd = seededRand('word-'+ds);
  const ri = (min,max)=> Math.floor(rnd()*(max-min+1))+min;
  const r1 = ()=> ri(1,9) + Math.round(rnd()*10)/10;
  const T = [
    ()=>{
      const p = ri(3,15)+0.5, n = ri(2,6);
      return { q:`超市里苹果每千克${p}元，妈妈买了${n}千克苹果，一共要付多少元？`, a:round1(p*n), unit:'元' };
    },
    ()=>{
      const v=ri(60,80), t=ri(2,5);
      return { q:`一辆汽车平均每小时行驶${v}千米，从甲地到乙地用了${t}小时。甲乙两地相距多少千米？`, a:v*t, unit:'千米' };
    },
    ()=>{
      const l=ri(8,25), w=ri(4,l-1);
      return { q:`一个长方形花坛，长${l}米，宽${w}米。它的周长是多少米？`, a:2*(l+w), unit:'米' };
    },
    ()=>{
      const a=ri(70,95), b=ri(70,95), c=ri(70,95);
      return { q:`小语文${a}分、数学${b}分、英语${c}分，三科平均分是多少分？`, a:Math.round((a+b+c)/3*10)/10, unit:'分' };
    },
    ()=>{
      const tot=ri(30,80), n=ri(3,6);
      return { q:`商店运来${tot}千克糖果，平均装在${n}个袋子里，每袋装多少千克？`, a:round1(tot/n), unit:'千克' };
    },
    ()=>{
      const p=ri(5,20), n=ri(3,8), pay=Math.ceil(p*n/10)*10;
      return { q:`一本笔记本${p}元，买${n}本，付了${pay}元，应找回多少元？`, a:pay-p*n, unit:'元' };
    },
    ()=>{
      const s=ri(120,300), t=ri(2,5);
      return { q:`工程队修一条${s}米长的路，每天修${Math.floor(s/t)}米，几天能修完？`, a:t, unit:'天' };
    },
  ];
  const idxs = [0,1,2,3,4,5,6].sort(()=>rnd()-0.5).slice(0,5);
  return idxs.map(i=>T[i]());
}
function startMath(mode,id){
  currentView = mode; viewParam = id; renderCurrent();
}
function numEq(a,b){
  const x=parseFloat(a), y=parseFloat(b);
  if(isNaN(x)||isNaN(y)) return false;
  return Math.abs(x-y) < 0.01;
}
function submitMath(mode){
  const qs = getDailyMath(mode);
  let right = 0;
  qs.forEach((q,i)=>{
    const inp = document.getElementById(`${mode}-${i}`);
    const mark = document.getElementById(`${mode}-r-${i}`);
    if(!inp) return;
    const ok = numEq(inp.value, q.a);
    if(ok){ right++; mark.textContent='✅'; }
    else { mark.textContent='❌'; inp.style.borderColor='var(--red)'; }
    if(mode==='word'){
      const det = document.getElementById(`word-detail-${i}`);
      if(det){ det.style.display='block'; det.innerHTML = `正确答案：<b style="color:var(--green-d)">${q.a}${q.unit||''}</b>`; }
    }
  });
  const el = document.getElementById(mode+'Score');
  if(el) el.innerHTML = `🎉 答对 <span style="color:var(--green-d)">${right}</span> / ${qs.length} 题`;
  toast(`批改完成：${right}/${qs.length} 正确`);
}
function finishMath(mode){
  const id = viewParam;
  const t = data.tasks.find(x=>x.id===id);
  if(!t){ toast('任务未找到'); return; }
  if(!t.done) toggleTask(id);
  else toast('任务已完成 ✓');
  currentView='subject'; viewParam='shu'; renderCurrent();
}

mistake(){
  const types = {};
  data.mistakes.forEach(m=>{ if(!m.mastered) types[m.type]=(types[m.type]||0)+1; });
  const maxC = Math.max(1, ...Object.values(types));
  const colors = ['#F06292','#64B5F6','#FFB74D','#81C784','#BA68C8','#FF8A65'];
  let bars = Object.entries(types).map(([t,c],i)=>
    `<div class="weak-bar">
      <div class="row"><span>${t}</span><span>${c}次</span></div>
      <div class="track"><div class="fill" style="width:${c/maxC*100}%;background:${colors[i%colors.length]}"></div></div>
    </div>`).join('');

  const allTypes = [...new Set(data.mistakes.map(m=>m.type))];
  let tags = allTypes.map(t=>`<span class="filter-tag" data-type="${t}" onclick="toggleMistakeFilter('${t}')">${t}</span>`).join('');

  return `

/* ---------- 5. 打卡统计 ---------- */
checkin(){
  let stats = { full:0, partial:0, none:0 };
  Object.values(data.checkin).forEach(s=>{ if(stats[s]!==undefined) stats[s]++; });

  // 日历 - 当月
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const firstDay = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = todayStr();

  // 漏打卡次数
  let missCount = 0;
  for(let d=1; d<=now.getDate(); d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const st = checkinStatus(ds);
    if(st==='none') missCount++;
  }

  let cells = '';
  ['日','一','二','三','四','五','六'].forEach(w=> cells += `<div class="cal-head">${w}</div>`);
  for(let i=0;i<firstDay;i++) cells += '<div class="cal-cell empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const st = checkinStatus(ds);
    const isToday = ds===today;
    const isFuture = new Date(ds) > now;
    const cls = isFuture ? 'empty' : st;
    cells += `<div class="cal-cell ${cls} ${isToday?'today':''}" onclick="showDayDetail('${ds}')">${d}</div>`;
  }

  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="lbl">🔥 连续全勤天数</div><div class="val" style="color:var(--green-d)">${data.streak}</div><div class="ico">🔥</div></div>
      <div class="stat-card"><div class="lbl">✨ 满分天数</div><div class="val" style="color:var(--orange)">${stats.full}</div><div class="ico">✨</div></div>
      <div class="stat-card"><div class="lbl">⚠️ 漏打卡次数</div><div class="val" style="color:var(--red)">${missCount}</div><div class="ico">⚠️</div></div>
    </div>
    <div class="section-title">📅 ${y}年${m+1}月 打卡日历</div>
    <div class="card">
      <div class="cal-grid">${cells}</div>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>全部完成</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--yellow)"></span>部分完成</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--red)"></span>未打卡</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--gray-l)"></span>无任务/未来</div>
      </div>
    </div>
  `;
},

function buyPlant(type,emoji,name,price){
  if(!spendSun(price)){ toast('阳光不足哦~ 努力完成任务吧！'); return; }
  // 找第一个空槽
  let slot = null;
  for(let r=0;r<3 && !slot;r++) for(let c=0;c<5;c++){ const s=`${r}-${c}`; if(!data.plants.find(p=>p.slot===s)){ slot=s; break; } }
  if(!slot){ toast('花园已满，先拔掉一些植物吧'); data.sun += price; save(); return; }
  data.plants.push({slot, type, emoji, name});
  save(); closeModal(); toast('种植成功！'+emoji); renderCurrent();
}

let matchState = { picked:null, matched:[], leftCol:[], rightCol:[], pairs:[] };
function getDailyWords(){
  const ds = todayStr();
  if(!data.dailyMath[ds]) data.dailyMath[ds] = {};
  if(!data.dailyMath[ds].words){
    const rnd = seededRand('words-'+ds);
    const shuffled = [...WORD_POOL].sort(()=>rnd()-0.5).slice(0,8);
    data.dailyMath[ds].words = shuffled;
    save();
  }
  return data.dailyMath[ds].words;
}
function renderMatchGame(){
  const words = getDailyWords();
  const el = document.getElementById('matchGame');
  if(!el) return;
  // 初始化打乱顺序
  if(matchState.pairs.length===0 || matchState.pairs.length!==words.length){
    const rnd = seededRand('match-'+todayStr()+'-layout');
    const left = [...words].sort(()=>rnd()-0.5);
    const right = [...words].sort(()=>rnd()-0.5);
    matchState = { picked:null, matched:[], leftCol:left, rightCol:right, pairs:words };
  }
  const itemStyle = (key,idx,col)=>{
    const isPicked = matchState.picked && matchState.picked.col===col && matchState.picked.idx===idx;
    const w = col==='en'?matchState.leftCol[idx]:matchState.rightCol[idx];
    const isDone = matchState.matched.includes(w.en);
    return `padding:10px 14px;border-radius:10px;background:${isDone?'var(--green-l)':isPicked?'var(--blue-l)':'#fff'};border:2px solid ${isDone?'var(--green)':isPicked?'var(--blue)':'#E0E0E0'};cursor:${isDone?'default':'pointer'};font-size:14px;text-align:center;transition:.15s;${isDone?'opacity:.6':''}`;
  };
  const leftItems = matchState.leftCol.map((w,i)=>
    `<div style="${itemStyle(w.en,i,'en')}" onclick="pickMatch('en',${i})">${w.en}</div>`).join('');
  const rightItems = matchState.rightCol.map((w,i)=>
    `<div style="${itemStyle(w.en,i,'zh')}" onclick="pickMatch('zh',${i})">${w.zh}</div>`).join('');
  el.innerHTML = `
    <div style="display:flex;gap:10px">
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">${leftItems}</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px">${rightItems}</div>
    </div>`;
  // 更新分数
  const sc = document.getElementById('matchScore');
  if(sc){
    if(matchState.matched.length===matchState.pairs.length){
      sc.innerHTML = '🎉 全部配对成功！词汇量 +1';
    }else{
      sc.innerHTML = `已配对 ${matchState.matched.length}/${matchState.pairs.length}`;
    }
  }
}
function pickMatch(col,idx){
  const words = matchState.pairs;
  const w = col==='en'?matchState.leftCol[idx]:matchState.rightCol[idx];
  if(matchState.matched.includes(w.en)) return;
  if(!matchState.picked){
    matchState.picked = {col,idx,w};
  }else{
    if(matchState.picked.w.en===w.en){
      // 配对成功
      matchState.matched.push(w.en);
      if(matchState.matched.length===words.length){
        data.sun += 5;
        save();
        toast('🎉 连连看全对！+5 ☀️', true);
      }
    }else{
      toast('再想想~');
    }
    matchState.picked = null;
  }
  renderMatchGame();
}
